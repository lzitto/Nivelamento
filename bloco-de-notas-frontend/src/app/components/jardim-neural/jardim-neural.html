<div class="bg-[#161B22] border border-[#21262D] rounded-2xl p-5 shadow-2xl relative overflow-hidden flex flex-col justify-between h-[420px]">

  <div class="grid grid-cols-12 gap-4 items-center my-auto z-10">

        <path d="M120 100 Q135 85 145 75 M75 95 Q60 85 50 75 M100 90 Q110 70 115 60 M100 90 Q90 70 85 60" stroke="#3A281E" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle cx="50" cy="75" r="16" fill="#153E2B" />
        <circle cx="145" cy="75" r="16" fill="#153E2B" />
        <circle cx="85" cy="55" r="18" fill="#1B4D36" />
        <circle cx="115" cy="55" r="18" fill="#1B4D36" />
        <circle cx="100" cy="40" r="20" fill="#225C40" />

        <g class="neuron-glow">
          <circle cx="50" cy="75" r="6" fill="#A7F3D0" />
          <circle cx="50" cy="75" r="3" fill="#FFFFFF" />
        </g>
        <g class="neuron-glow-delayed">

        <g class="neuron-glow">

    <div class="col-span-5 flex flex-col gap-2.5">
      <div class="bg-[#0B0F17]/70 border border-[#21262D] rounded-xl p-2.5">
        <span class="text-[11px] font-semibold text-[#8B949E] block">Foco atual</span>
        <span class="text-xl font-bold text-white tracking-tight">{{ dadosJardim?.focoAtual || 0 }}</span>
      </div>
      <div class="bg-[#0B0F17]/70 border border-[#21262D] rounded-xl p-2.5">
        <span class="text-[11px] font-semibold text-[#8B949E] block">Neurônios</span>
        <span class="text-xl font-bold text-[#10B981] tracking-tight">{{ dadosJardim?.totalNeuronios || 0 }}</span>
      </div>
      <div class="bg-[#0B0F17]/70 border border-[#21262D] rounded-xl p-2.5">
        <span class="text-[11px] font-semibold text-[#8B949E] block">Crescimento</span>
        <span class="text-xl font-bold text-[#34D399] tracking-tight">+{{ dadosJardim?.crescimento || 0 }}%</span>
      </div>
    </div>

  <div class="bg-[#0B0F17]/80 border border-[#21262D] rounded-xl py-2 px-3 flex items-center justify-center gap-2 text-xs text-[#8B949E] z-10">
