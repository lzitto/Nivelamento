<div class="min-h-screen bg-[#0B0F17] text-[#F0F6FC] flex items-center justify-center p-4">
  
  <div class="w-full max-w-md bg-[#161B22] border border-[#21262D] rounded-2xl p-8 shadow-2xl flex flex-col gap-6">
    
    <!-- Header do Login -->
    <div class="flex flex-col items-center gap-2 text-center">
      <div class="p-3 bg-[#10B981]/10 rounded-2xl text-[#10B981] border border-[#10B981]/20">
        🧠
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide mt-2">NeuroNotas</h1>
      <p class="text-xs text-[#8B949E] uppercase tracking-wider">FOCO • ESTUDO • EVOLUÇÃO</p>
    </div>

    <!-- Formulário -->
    <form (submit)="fazerLogin($event)" class="flex flex-col gap-4">
      
      <div>
        <label class="block text-xs font-semibold text-[#8B949E] uppercase tracking-wider mb-2">E-mail</label>
        <input 
          type="email" 
          placeholder="seu.email@exemplo.com"
          class="w-full bg-[#0B0F17] border border-[#21262D] rounded-xl px-4 py-3 text-sm text-white placeholder-[#484F58] focus:outline-none focus:border-[#10B981] transition-all"
          required
        >
      </div>

      <div>
        <label class="block text-xs font-semibold text-[#8B949E] uppercase tracking-wider mb-2">Senha</label>
        <input 
          type="password" 
          placeholder="••••••••"
          class="w-full bg-[#0B0F17] border border-[#21262D] rounded-xl px-4 py-3 text-sm text-white placeholder-[#484F58] focus:outline-none focus:border-[#10B981] transition-all"
          required
        >
      </div>

      <button 
        type="submit" 
        class="w-full py-3 bg-[#10B981] hover:bg-[#059669] text-[#0B0F17] font-bold text-sm rounded-xl transition-all shadow-lg shadow-[#10B981]/10 mt-2"
      >
        Entrar no Sistema
      </button>

    </form>

    <!-- Rodapé Card -->
    <div class="text-center text-xs text-[#8B949E] pt-2 border-t border-[#21262D]/50">
      Não tem uma conta? <a href="#" class="text-[#10B981] font-semibold hover:underline">Cadastre-se</a>
    </div>

  </div>

</div>
